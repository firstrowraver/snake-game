<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #controls {
      display: none;
      grid-template-columns: repeat(3, min(14vw, 56px));
      grid-template-rows: repeat(3, min(14vw, 56px));
      gap: 4px;
      margin-top: 16px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .ctrl-btn {
      width: min(14vw, 56px);
      height: min(14vw, 56px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      font-size: min(6vw, 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .ctrl-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }
    .ctrl-btn[data-dir="up"]    { grid-column: 2; grid-row: 1; }
    .ctrl-btn[data-dir="left"]  { grid-column: 1; grid-row: 2; }
    .ctrl-btn[data-dir="right"] { grid-column: 3; grid-row: 2; }
    .ctrl-btn[data-dir="down"]  { grid-column: 2; grid-row: 3; }
    @media (pointer: coarse) {
      #controls {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="controls">
    <button class="ctrl-btn" data-dir="up">&#9650;</button>
    <button class="ctrl-btn" data-dir="left">&#9664;</button>
    <button class="ctrl-btn" data-dir="right">&#9654;</button>
    <button class="ctrl-btn" data-dir="down">&#9660;</button>
  </div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
